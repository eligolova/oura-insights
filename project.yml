name: OuraInsights
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  OuraInsights:
    type: application
    platform: [iOS, macOS]
    sources:
      - OuraInsights
    settings:
      base:
        INFOPLIST_FILE: OuraInsights/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.oura-insights
        PRODUCT_NAME: Oura Insights
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Oura Insights
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    entitlements:
      path: OuraInsights/OuraInsights.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: OuraInsights/Info.plist
      properties:
        CFBundleDisplayName: Oura Insights
        NSLocationWhenInUseUsageDescription: "Oura Insights uses your location to fetch local weather data and correlate it with your health metrics."
        NSFaceIDUsageDescription: "Use Face ID to secure your health data."
        ITSAppUsesNonExemptEncryption: false

  OuraInsightsTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources:
      - OuraInsightsTests
    dependencies:
      - target: OuraInsights
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
