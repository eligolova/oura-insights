name: OuraInsights
options:
  minimumXcodeGenVersion: 2.44.0
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: dev.codex.oura-insights
    SWIFT_VERSION: 5.10
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  OuraInsights:
    type: application
    platform: macOS
    info:
      path: App/AppEntry/macOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.codex.oura-insights.oauth
            CFBundleURLSchemes:
              - oura-insights
    sources:
      - path: App/AppEntry/macOS
      - path: App/Views
      - path: App/ViewModels
      - path: App/Charts
      - path: Data/Models
      - path: Data/Persistence
      - path: Data/Importers
      - path: Data/Normalisation
      - path: Services/OuraClient
      - path: Services/WeatherClient
      - path: Services/LocationService
      - path: Analysis/Metrics
      - path: Analysis/Correlations
    settings:
      base:
        PRODUCT_NAME: OuraInsights
  OuraInsightsiOS:
    type: application
    platform: iOS
    info:
      path: App/AppEntry/iOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.codex.oura-insights.oauth
            CFBundleURLSchemes:
              - oura-insights
    sources:
      - path: App/AppEntry/iOS
      - path: App/Views
      - path: App/ViewModels
      - path: App/Charts
      - path: Data/Models
      - path: Data/Persistence
      - path: Data/Importers
      - path: Data/Normalisation
      - path: Services/OuraClient
      - path: Services/WeatherClient
      - path: Services/LocationService
      - path: Analysis/Metrics
      - path: Analysis/Correlations
    settings:
      base:
        PRODUCT_NAME: OuraInsights
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: 1
schemes:
  OuraInsights:
    build:
      targets:
        OuraInsights: all
    run:
      config: Debug
    test:
      config: Debug
  OuraInsightsiOS:
    build:
      targets:
        OuraInsightsiOS: all
    run:
      config: Debug
    test:
      config: Debug
